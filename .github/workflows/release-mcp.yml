name: Release impersonate-mcp

# Tag with `mcp-v<version>` (e.g. mcp-v0.1.0), where <version> matches `version`
# in impersonate-mcp/main.go and impersonate-mcp/mcpb/manifest.json. The plain
# `v*` tags belong to the proxy and its Docker image.
on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish to the MCP Registry, e.g. mcp-v0.1.0"
        required: true

jobs:
  release:
    # A manual run only re-publishes to the registry; it never rebuilds assets.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: impersonate-mcp/go.mod

      - name: Test
        run: cd impersonate-mcp && go test ./...

      - name: Build bundles
        run: impersonate-mcp/scripts/package-mcpb.sh

      - name: Check the tag matches the version
        run: |
          version="$(jq -r .version impersonate-mcp/mcpb/manifest.json)"
          if [ "${GITHUB_REF_NAME}" != "mcp-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            impersonate-mcp/dist/*.mcpb impersonate-mcp/dist/SHA256SUMS.txt \
            --title "impersonate-mcp ${GITHUB_REF_NAME#mcp-v}" \
            --generate-notes

  publish:
    needs: release
    # Run after `release`, or on its own for a manual re-publish. `always()`
    # lets the manual path through when `release` is skipped.
    if: always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login to the MCP Registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Download the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p impersonate-mcp/dist
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir impersonate-mcp/dist

      - name: Generate server.json
        # The script cds into impersonate-mcp/, so the dist dir is relative to that.
        run: impersonate-mcp/scripts/gen-server-json.sh "${TAG#mcp-v}" dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: cd impersonate-mcp/dist && ../../mcp-publisher publish
