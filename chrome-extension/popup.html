<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="icon.svg" class="logo" alt="">
    <span class="title">Impersonate Proxy</span>
  </div>

  <div class="section">
    <div class="toggle-row">
      <span class="toggle-label">Route through proxy</span>
      <label class="switch">
        <input type="checkbox" id="proxyToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="field">
      <label for="tlsPreset">TLS Preset</label>
      <select id="tlsPreset">
        <option value="chrome">Chrome</option>
        <option value="firefox">Firefox</option>
        <option value="safari">Safari</option>
        <option value="edge">Edge</option>
        <option value="ios">iOS</option>
        <option value="random">Random</option>
        <option value="golang">Golang</option>
        <option value="custom">Custom (JA3/JA4)</option>
      </select>
    </div>

    <div class="field" id="customHelloFields" hidden>
      <div class="field">
        <label for="customCiphers">Cipher Suites <span class="hint">ordered, decimal or 0x hex, comma-separated</span></label>
        <textarea id="customCiphers" rows="2" placeholder="0x0a0a, 4865, 4866, 4867, 49195, …" spellcheck="false"></textarea>
      </div>
      <div class="field">
        <label for="customCurves">Curves <span class="hint">X25519, X25519Kyber768, P256, P384, P521</span></label>
        <input type="text" id="customCurves" placeholder="X25519, P256, P384" spellcheck="false" autocomplete="off">
      </div>
      <div class="field">
        <label for="customVersions">TLS Versions</label>
        <input type="text" id="customVersions" placeholder="1.2, 1.3" spellcheck="false" autocomplete="off">
      </div>
      <div class="field">
        <label for="customExtensions">Extensions <span class="hint">ordered, decimal or 0x hex, comma-separated — controls JA3 extension order</span></label>
        <textarea id="customExtensions" rows="2" placeholder="0x0a0a, 0, 23, 65281, 10, 11, 35, 16, 5, 13, 18, 51, 45, 43, 27, 21" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="field">
      <div class="field-header">
        <label for="clientIP">Client IP <span class="hint">X-Forwarded-For / True-Client-IP</span></label>
        <label class="random-label"><input type="checkbox" id="clientIPRandom"> Random</label>
      </div>
      <input type="text" id="clientIP" placeholder="e.g. 203.0.113.1  (empty = disabled)" spellcheck="false" autocomplete="off">
    </div>

    <div class="field">
      <div class="field-header">
        <label for="userAgent">User-Agent <span class="hint">empty = pass through</span></label>
        <label class="random-label"><input type="checkbox" id="userAgentRandom"> Random</label>
      </div>
      <textarea id="userAgent" rows="2" placeholder="Mozilla/5.0 …" spellcheck="false"></textarea>
    </div>

    <button id="applyBtn">Apply</button>
    <div id="applyMsg" class="apply-msg"></div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="toggle-row">
      <span class="toggle-label">Upstream proxy</span>
      <label class="switch">
        <input type="checkbox" id="upstreamEnabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="field" style="margin-top: 10px;">
      <label for="upstreamSelect">Select <span class="hint">changes the real egress IP</span></label>
      <select id="upstreamSelect">
        <option value="">(no proxies configured)</option>
      </select>
    </div>
  </div>

  <div class="divider"></div>

  <div class="footer">
    <div class="status-row">
      <span id="statusDot" class="dot dot-unknown"></span>
      <span id="statusText">Checking…</span>
    </div>
    <div class="addr-row">
      <label for="mgmtAddr">API</label>
      <input type="text" id="mgmtAddr" placeholder="http://127.0.0.1:8081" spellcheck="false" autocomplete="off">
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
